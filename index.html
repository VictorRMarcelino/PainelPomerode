<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08090c">
    <meta name="description" content="Receitas e despesas do Município de Pomerode/SC em gráficos e indicadores, com dados do Portal da Transparência.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Painel Pomerode</title>
    <script>
      // Aplica o tema salvo antes da página aparecer (evita piscar no tema errado).
      try {
        var tema = localStorage.getItem('painel-pomerode:tema')
        if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
